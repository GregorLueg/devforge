name: pkgdown

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pkgdown:
    uses: GregorLueg/personal-actions/.github/workflows/r-pkgdown.yml@v1
    with:
      rust: false
      gpu: false
      # No vignettes in this package, so nothing to render with Quarto.
      quarto: false
    secrets: inherit
